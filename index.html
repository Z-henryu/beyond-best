    }).join("");

    $("#view-today").innerHTML =
      '<div class="today-top">' +
        "<div>" +
          '<div class="eyebrow">Beyond Best · 今日</div>' +
          '<div class="date-big">' + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日<small>" + DAYS[todayIdx] + "</small></div>" +
        "</div>" +
        '<div class="pickers">' +
          '<select class="sel" id="sel-plan" aria-label="选择课表">' + planOpts + "</select>" +
          '<select class="sel" id="sel-block" aria-label="选择周模板">' + blockOpts + "</select>" +
        "</div>" +
      "</div>" +

      '<div class="hero' + (isRest ? " hero-rest" : "") + '">' +
        '<div class="hero-label">今日训练 · ' + esc(weekTitleParts(block.title)[0]) + "</div>" +
        '<div class="hero-type"><h2>' + esc(day.type) + "</h2>" +
          (day.quality ? '<span class="chip" style="background:rgba(255,255,255,.92);color:#16233c">质量课</span>' : "") +
          (done ? '<span class="chip" style="background:rgba(255,255,255,.9);color:#123">已打卡</span>' : "") +
        "</div>" +
        '<div class="hero-body">' + esc(day.content) + "</div>" +
        '<div class="hero-actions">' +
          '<button class="btn ' + (done ? "is-done" : "btn-accent") + '" data-act="check-today">' +
            (done ? IC.check + " 已完成，点击撤销" : IC.check + " 打卡") + "</button>" +
          '<button class="btn" data-act="copy-today">' + IC.copy + " 复制</button>" +
          '<button class="btn" data-act="open-today">' + IC.plan + " 看详情</button>" +
        "</div>" +
      "</div>" +

      '<div class="stats">' +
        '<div class="stat"><div class="k">本周完成</div><div class="v">' + total + '<span>/ 7 天</span></div></div>' +
        '<div class="stat"><div class="k">连续打卡</div><div class="v">' + streak() + '<span>天</span></div></div>' +
        '<div class="stat"><div class="k">下一节质量课</div><div class="v" style="font-size:15px;line-height:1.4">' +
          (nq ? (nq.today ? "今天 · " : esc(DAYS[nq.day]) + " · ") + esc(nq.data.type) : (hasQ ? "本周期已练完" : "本周没有质量课")) +
        "</div></div>" +
      "</div>" +

      '<div class="section">' +
        '<div class="section-head"><h2>本周进度</h2><span class="hint">点一下就能打卡</span></div>' +
        '<div class="card" style="padding:18px"><div class="ring-wrap">' +
          '<div style="position:relative;flex:none">' +
            '<svg class="ring" width="76" height="76" viewBox="0 0 76 76">' +
              '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">' +
              '<stop offset="0" stop-color="#4b7bec"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient></defs>' +
              '<circle class="bg" cx="38" cy="38" r="32"/>' +
              '<circle class="fg" cx="38" cy="38" r="32" stroke="url(#rg)" stroke-dasharray="' + (total / 7 * 201).toFixed(1) + ' 201"/>' +
            "</svg>" +
            '<div style="position:absolute;inset:0;display:grid;place-items:center"><div class="ring-num">' +
              Math.round(total / 7 * 100) + "<span>%</span></div></div>" +
          "</div>" +
          '<div style="flex:1;min-width:0"><div class="week-strip" id="strip">' +
            DAYS.map(function (w, i) {
              const dd = dateOf(i);
              const dday = block.days[i] || {};
              const dn = isDone(p.key, S.block, i);
              return '<div class="daycell' + (i === todayIdx ? " is-today" : "") + (dn ? " is-done" : "") +
                '" data-act="day" data-day="' + i + '" role="button" tabindex="0">' +
                '<div class="w">' + w.slice(1) + "</div>" +
                '<div class="d">' + dd.getDate() + "</div>" +
                '<div class="dot' + (dday.quality ? " q" : "") + '"></div>' +
                (dn ? '<div class="check">' + IC.check + "</div>" : "") +
                "</div>";
            }).join("") +
          "</div></div>" +
        "</div></div>" +
      "</div>" +

      '<div class="section">' +
        '<div class="section-head"><h2>周模板一览</h2><span class="hint">' + p.blocks.length + " 个模板 · " + esc(p.group) + (p.phase ? " · " + esc(p.phase) : "") + "</span></div>" +
        p.blocks.map(function (b, i) {
          const parts = weekTitleParts(b.title);
          return '<div class="card week-card" style="margin-bottom:10px">' +
            '<div class="week-head" style="border-bottom:0">' +
              '<div class="week-top"><div class="week-title"><span class="wname">' + esc(parts[0]) + "</span></div>" +
                '<div class="week-badge">' + doneCount(p.key, i) + "/7 已完成</div></div>" +
              '<div class="week-sub">' + esc(parts[1]) + "</div>" +
            "</div></div>";
        }).join("") +
      "</div>" +

      '<div class="section"><div class="section-head"><h2>工具</h2></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn" data-act="goto-pace">' + IC.pace + " 配速换算</button>" +
          '<button class="btn" data-act="goto-records">' + IC.upload + " 打卡与记录</button>" +
          '<button class="btn" data-act="open-search">' + IC.search + " 搜索全站</button>" +
          '<button class="btn" data-act="print">' + IC.print + " 打印 / 存 PDF</button>" +
        "</div>" +
      "</div>";

    const sp = $("#sel-plan"), sb = $("#sel-block");
    const wn = $("#weekmeta"); if (wn) wn.textContent = p.key + " · 第 " + (S.block + 1) + " 周";
    if (sp) sp.addEventListener("change", function () { S.plan = sp.value; S.block = 0; save(); renderToday(); });
    if (sb) sb.addEventListener("change", function () { S.block = +sb.value; save(); renderToday(); });
  }

  /* ================= 课表 ================= */
  function planCard(cur, b, bi, q) {
    const parts = weekTitleParts(b.title);
    const n = parts[0], sub = parts[1];
    const days = b.days.map(function (d, di) { return Object.assign({}, d, { di: di }); }).filter(function (d) {
      if (!q) return true;
      return (d.type + d.content + d.day).toLowerCase().indexOf(q.toLowerCase()) >= 0;
    });
    if (!days.length) return "";
    const isCurBlock = bi === S.block;
    return '<div class="card week-card" ' + (isCurBlock ? 'style="border-color:rgba(75,123,236,.45)"' : "") + ">" +
      '<div class="week-head">' +
        '<div class="week-top">' +
          '<div class="week-title"><span class="wname">' + esc(n) + "</span>" +
            (isCurBlock ? ' <span class="chip chip-brand" style="margin-left:6px">今日所在</span>' : "") + "</div>" +
          '<div class="week-badge">' + doneCount(cur.key, bi) + "/7 已完成</div>" +
        "</div>" +
        '<div class="week-sub">' + esc(sub) + "</div>" +
      "</div>" +
      '<div class="days">' +
        days.map(function (d) {
          const rest = /休息/.test(d.type);
          const done = isDone(cur.key, bi, d.di);
          const isToday = isCurBlock && d.di === todayIdx;
          return '<div class="day' + (isToday ? " is-today" : "") + (rest ? " is-rest" : "") +
            '" data-act="day" data-day="' + d.di + '" data-block="' + bi + '">' +
            '<div class="day-w">' + esc(d.day) + "</div>" +
            '<div class="day-main"><div class="day-line">' +
              '<span class="chip ' + (d.quality ? "chip-q" : rest ? "chip-r" : "chip-e") + '">' + esc(d.type) + "</span>" +
              (done ? '<span class="chip chip-r" style="background:var(--teal-soft);color:var(--teal)">已打卡</span>' : "") +
            "</div>" +
            '<div class="day-content">' + esc(d.content) + "</div></div>" +
            (done ? '<div class="day-done">' + IC.check + "</div>" : "") +
            "</div>";
        }).join("") +
      "</div></div>";
  }

  function renderPlan() {
    const cur = currentPlan();
    const q0 = (window.__q || "").trim();

    $("#view-plan").innerHTML =
      '<div class="eyebrow">Training plan</div>' +
      '<h1 class="page-title">' + esc(cur.key) + "</h1>" +
      '<p class="page-sub">共 ' + cur.blocks.length + " 个周模板 · 内容与 Excel 课表一致，未作改动</p>" +
      '<div class="filter-row">' +
        '<div class="seg" id="seg-group">' +
          groups.map(function (g) {
            return '<button data-group="' + g + '" class="' + (g === cur.group ? "is-active" : "") + '">' + g + "</button>";
          }).join("") +
        "</div>" +
        '<div class="search">' + IC.search + '<input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="搜索：阈值 / 力量 / 休息 …" value="' + esc(q0) + '"></div>' +
      "</div>" +
      ((cur.group === "中距离" || cur.group === "长距离")
        ? '<div class="filter-row" style="margin-top:-8px"><div class="seg" id="seg-phase">' +
          phaseList(cur.group).map(function (p) {
            return '<button data-plan="' + esc(p.key) + '" class="' + (p.key === cur.key ? "is-active" : "") + '">' + esc(p.phase) + "</button>";
          }).join("") + "</div></div>"
        : "") +
      '<div id="plan-list"></div>' +
      '<div class="section-head" style="margin-top:26px"><h2>提示</h2></div>' +
      '<div class="notes-card">质量课（<span class="chip chip-q">橙色标签</span>）的日期不要随意挪动；两节质量课之间至少隔 48 小时。状态不好时把当天质量课降级为轻松跑，不要在同一周补课。点任意一天可以查看详情、打卡。</div>';

    const paint = function () {
      const list = $("#plan-list");
      if (!list) return;
      const q = (window.__q || "").trim();
      const body = cur.blocks.map(function (b, bi) { return planCard(cur, b, bi, q); }).join("");
      let n = 0;
      if (q) {
        cur.blocks.forEach(function (b) {
          b.days.forEach(function (d) {
            if ((d.type + d.content + d.day).toLowerCase().indexOf(q.toLowerCase()) >= 0) n++;
          });
        });
      }
      const meta = q ? '<div class="search-meta">「' + esc(q) + "」匹配到 " + n + " 个训练日</div>" : "";
      list.innerHTML = meta + (body || '<div class="empty">没有匹配的训练日。搜索支持中文，试试：阈值 / 力量 / 休息 / 间歇。</div>');
    };

    const wm = $("#weekmeta");
    if (wm) wm.textContent = cur.key + " · 第 " + (S.block + 1) + " 周";

    $$("#seg-group button").forEach(function (b) {
      b.addEventListener("click", function () {
        const g = b.dataset.group;
        const first = planByKey(phaseList(g)[0].key);
        S.plan = (g === "中距离" || g === "长距离")
          ? (phaseList(g).find(function (x) { return x.phase === "基础期"; }) || phaseList(g)[0]).key
          : first.key;
        S.block = 0; save(); renderPlan();
      });
    });
    $$("#seg-phase button").forEach(function (b) {
      b.addEventListener("click", function () { S.plan = b.dataset.plan; S.block = 0; save(); renderPlan(); });
    });

    const qi = $("#q");
    if (qi) {
      let composing = false;
      qi.addEventListener("compositionstart", function () { composing = true; });
      qi.addEventListener("compositionend", function () { composing = false; window.__q = qi.value; paint(); });
      qi.addEventListener("input", function (e) {
        if (composing || e.isComposing) return;
        window.__q = qi.value;
        paint();
      });
      qi.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { window.__q = qi.value; paint(); e.preventDefault(); }
      });
    }
    paint();
  }

  /* ================= 配速 ================= */
  function renderPace() {
    const t15 = parseTime(S.pb1500) || 270;
    const t5 = parseTime(S.pb5000) || 1020;
    const p15 = t15 / 1.5, p5 = t5 / 5;

    const rows = function (arr, base) {
      return arr.map(function (pair) {
        const k = pair[0], off = pair[1];
        const v = base + off;
        return '<div class="pace-item"><div class="k">' + esc(k) + "</div>" +
          '<div class="v">' + fmt(v) + '<span style="font-size:11px;font-weight:600;color:var(--muted)">/km</span></div>' +
          '<div class="s">400 米 ' + fmt(v * 0.4) + "</div></div>";
      }).join("");
    };

    const blocksHtml = DATA.pace.blocks.map(function (b) {
      if (b.type === "steps") {
        return '<div class="section"><div class="section-head"><h2>' + esc(b.title) + "</h2></div>" +
          '<div class="steps">' + b.items.map(function (it) {
            return '<div class="step"><div class="lbl">' + esc(it.label) + "</div><div>" + esc(it.text) + "</div></div>";
          }).join("") + "</div></div>";
      }
      if (b.type === "rules") {
        return '<div class="section"><div class="section-head"><h2>' + esc(b.title) + "</h2></div>" +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          b.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          b.rows.map(function (r) {
            return "<tr>" + r.map(function (c, i) {
              return '<td' + (i === 3 ? ' style="min-width:280px"' : "") + ">" + esc(c) + "</td>";
            }).join("") + "</tr>";
          }).join("") + "</tbody></table></div></div>";
      }
      if (b.type === "grid") {
        const is15 = /1500/.test(b.head[0]);
        const anchor = is15 ? t15 : t5;
        let best = -1, bd = 1e9;
        b.rows.forEach(function (r, i) {
          const v = parseTime(r[0]);
          if (v == null) return;
          const diff = Math.abs(v - anchor);
          if (diff < bd) { bd = diff; best = i; }
        });
        return '<div class="section"><div class="section-head"><h2>' + esc(b.title) + '</h2><span class="hint">高亮行 = 最接近你的成绩</span></div>' +
          '<div class="tbl-wrap"><table class="tbl num"><thead><tr>' +
          b.head.map(function (h) { return '<th style="text-align:center">' + esc(h) + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          b.rows.map(function (r, i) {
            return '<tr class="' + (i === best ? "near" : "") + '">' +
              r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table></div></div>";
      }
      if (b.type === "section") {
        return '<div class="section"><div class="section-head"><h2>' + esc(b.title) + "</h2></div>" +
          '<div class="bullets">' + b.items.map(function (it) { return "<div>" + esc(it.text) + "</div>"; }).join("") + "</div></div>";
      }
      return "";
    }).join("");

    $("#view-pace").innerHTML =
      '<div class="eyebrow">Pace</div>' +
      '<h1 class="page-title">配速换算</h1>' +
      '<p class="page-sub">' + esc(DATA.pace.title) + "</p>" +
      '<div class="card pb-card">' +
        '<div class="pb-row">' +
          '<div class="field"><label>1500 米成绩（中距离）</label><input id="pb15" value="' + esc(S.pb1500) + '" inputmode="numeric" placeholder="4:30" aria-label="1500 米成绩"></div>' +
          '<div class="field"><label>5000 米成绩（长距离）</label><input id="pb5" value="' + esc(S.pb5000) + '" inputmode="numeric" placeholder="17:00" aria-label="5000 米成绩"></div>' +
        "</div>" +
        '<div class="calc-note">格式 mm:ss，例如 4:30、17:00；也可以直接填秒数。改完立即重算并自动记住。' +
          (DATA.pace.note ? "　" + esc(DATA.pace.note) : "") + "</div>" +
      "</div>" +
      '<div class="section"><div class="section-head"><h2>中距离（800 / 1500 米）</h2><span class="hint" id="hint15">P1500 = ' + fmt(p15) + "/km</span></div>" +
        '<div class="pace-out" id="out15">' + rows(MID_OFF, p15) + "</div></div>" +
      '<div class="section"><div class="section-head"><h2>长距离（5000 米 / 10000 米 / 半马）</h2><span class="hint" id="hint5">P5k = ' + fmt(p5) + "/km</span></div>" +
        '<div class="pace-out" id="out5">' + rows(LONG_OFF, p5) + "</div></div>" +
      '<div class="section"><button class="btn btn-primary" data-act="copy-pace">' + IC.copy + " 复制我的配速卡</button></div>" +
      blocksHtml +
      '<div class="section"><div class="notes-card"><b>说明</b>　左侧是课表原文的推断方法，右侧数字是按同一套规则实时算出的结果；两者口径一致。400 米单圈 = 每公里配速 × 0.4，跑前把单圈写在手背上。</div></div>';

    $$("#view-pace .section").forEach(function (el, i) { el.dataset.sec = i; });

    const bind = function (id, key, outId, hintId, offs, div) {
      const el = $(id);
      if (!el) return;
      el.addEventListener("input", function () {
        S[key] = el.value; save();
        const t = parseTime(el.value) || (div === 1.5 ? 270 : 1020);
        const base = t / div;
        const out = $(outId); if (out) out.innerHTML = rows(offs, base);
        const hint = $(hintId); if (hint) hint.textContent = (div === 1.5 ? "P1500 = " : "P5k = ") + fmt(base) + "/km";
      });
      el.addEventListener("blur", function () { if (el.value !== S[key]) renderPace(); });
    };
    bind("#pb15", "pb1500", "#out15", "#hint15", MID_OFF, 1.5);
    bind("#pb5", "pb5000", "#out5", "#hint5", LONG_OFF, 5);
  }

  /* ================= 训练说明 ================= */
  let openAcc = 0;
  function renderNotes() {
    let idx = -1;
    const html = DATA.notes.map(function (n) {
      if (n.kind === "section") {
        idx++;
        const opened = idx === openAcc;
        return '<div class="acc' + (opened ? " is-open" : "") + '" data-acc="' + idx + '">' +
          '<div class="acc-head" role="button" tabindex="0">' + esc(n.title) + '<span class="arw">' + IC.arrow + "</span></div>" +
          '<div class="acc-body" data-body="' + idx + '"></div></div>';
      }
      return '<div data-for="' + idx + '" class="nrow"><div class="lbl">' + esc(n.label) + "</div><div>" + esc(n.text) + "</div></div>";
    }).join("");

    $("#view-notes").innerHTML =
      '<div class="eyebrow">Manual</div>' +
      '<h1 class="page-title">训练说明</h1>' +
      '<p class="page-sub">训练类型、配速推断、周期安排、力量组次、安全提示 —— 与课表里的「训练说明」一致。</p>' + html;

    const wrappers = Array.from($("#view-notes").children).filter(function (el) { return el.hasAttribute("data-for"); });
    wrappers.forEach(function (w) {
      const body = $('[data-body="' + w.dataset.for + '"]');
      if (body) body.appendChild(w);
    });

    $$(".acc-head").forEach(function (h) {
      const toggle = function () {
        const acc = h.parentElement;
        const wasOpen = acc.classList.contains("is-open");
        $$(".acc").forEach(function (a) { a.classList.remove("is-open"); });
        if (!wasOpen) { acc.classList.add("is-open"); openAcc = +acc.dataset.acc; }
        else openAcc = -1;
      };
      h.addEventListener("click", toggle);
      h.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
  }

  /* ================= 记录 ================= */
  function checkDates() {
    const m = {};
    Object.keys(S.checks).forEach(function (k) {
      const d = new Date(S.checks[k]);
      const s = dstr(d);
      m[s] = (m[s] || 0) + 1;
    });
    return m;
  }
  function heatmapHtml() {
    const counts = checkDates();
    const t = new Date();
    const start = new Date(t);
    start.setDate(start.getDate() - ((t.getDay() + 6) % 7) - 11 * 7);
    let cells = "";
    for (let w = 0; w < 12; w++) {
      for (let d = 0; d < 7; d++) {
        const day = new Date(start);
        day.setDate(start.getDate() + w * 7 + d);
        const key = dstr(day);
        const n = counts[key] || 0;
        const lv = n === 0 ? "" : n === 1 ? "l1" : n === 2 ? "l2" : n === 3 ? "l3" : "l4";
        const future = day > t;
        cells += '<i class="' + lv + '" title="' + key + (n ? " · 打卡 " + n + " 次" : "") + '"' +
          (future ? ' style="opacity:.35"' : "") + "></i>";
      }
    }
    return '<div class="hm">' + cells + "</div>" +
      '<div class="hm-legend">少<i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>多</div>';
  }
  function renderRecords() {
    const pbs = STD.map(function (s) {
      const b = bestFor(s.km, S.records);
      return { name: s.name, km: s.km, rec: b };
    });
    const totalChecks = Object.keys(S.checks).length;
    const recs = S.records.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });

    $("#view-records").innerHTML =
      '<div class="eyebrow">Records</div>' +
      '<div class="rec-head"><div><h1 class="page-title">打卡与记录</h1>' +
        '<p class="page-sub">' + (S.user ? "当前账号：" + esc(S.user) : "未登录 · 数据保存在本机") +
        " · 打卡 " + totalChecks + " 次 · 连续 " + streak() + " 天</p></div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn btn-primary" data-act="pick-file">' + IC.upload + " 上传跑步记录</button>" +
          '<button class="btn" data-act="open-auth">' + (S.user ? "账号" : "登录 / 注册") + "</button>" +
        "</div></div>" +

      '<div class="section"><div class="section-head"><h2>个人最好成绩</h2><span class="hint">从记录里自动识别（±3% 距离）</span></div>' +
        '<div class="pb-grid">' + pbs.map(function (p) {
          if (!p.rec) return '<div class="pb-item empty"><div class="k">' + p.name + '</div><div class="v">暂无</div><div class="s">—</div></div>';
          return '<div class="pb-item has"><div class="k">' + p.name + '</div><div class="v">' + fmtHMS(p.rec.sec) +
            '</div><div class="s">' + esc(p.rec.date || "") + " · " + (+p.rec.km).toFixed(2) + " km</div></div>";
        }).join("") + "</div>" +
        (bestFor(5, S.records) ? '<div style="margin-top:12px"><button class="btn btn-sm" data-act="use-pb">用 5 公里 PB（' + fmtHMS(bestFor(5, S.records).sec) + '）更新配速换算</button></div>' : "") +
      "</div>" +

      '<div class="section"><div class="section-head"><h2>打卡日历</h2><span class="hint">最近 12 周</span></div>' +
        '<div class="card" style="padding:16px 18px"><div class="heat">' + heatmapHtml() + "</div></div></div>" +

      '<div class="section"><div class="section-head"><h2>添加记录</h2><span class="hint">GPX / TCX / CSV / JSON 或手动填</span></div>' +
        '<div class="card" style="padding:16px">' +
          '<div class="upload" id="dropZone" data-act="pick-file">' +
            "<div><b>点击上传</b> 或把文件拖到这里</div>" +
            '<div class="hint">支持 手表导出的 .gpx / .tcx，以及 .csv / .json（含距离与用时）</div>' +
          "</div>" +
          '<input type="file" id="fileInput" accept=".gpx,.tcx,.csv,.json,.txt" style="display:none">' +
          '<div class="rec-form">' +
            '<input id="rDate" type="date" value="' + dstr(new Date()) + '" aria-label="日期">' +
            '<input id="rKm" type="number" step="0.01" min="0" placeholder="距离 km" aria-label="距离">' +
            '<input id="rTime" type="text" placeholder="用时 例如 17:32" aria-label="用时">' +
            '<button class="btn" data-act="add-record">' + IC.plus + " 添加</button>" +
          "</div>" +
        "</div></div>" +

      '<div class="section"><div class="section-head"><h2>跑步记录</h2><span class="hint">' + recs.length + " 条</span></div>" +
        '<div class="card"><div class="rec-list">' +
          (recs.length ? recs.map(function (r) {
            const pace = r.km ? fmt(r.sec / r.km) : "--";
            const isPB = STD.some(function (s) {
              if (Math.abs(r.km - s.km) / s.km > 0.03) return false;
              const b = bestFor(s.km, S.records);
              return b && b.id === r.id;
            });
            return '<div class="rec">' +
              '<div class="when">' + esc(r.date || "") + "</div>" +
              '<div class="main"><div class="t">' + (+r.km).toFixed(2) + " km · " + fmtHMS(r.sec) +
                ' <span class="sub">' + pace + "/km</span>" + (isPB ? ' <span class="pb">PB</span>' : "") + "</div>" +
                '<div class="sub">' + esc(r.src || "") + (r.name ? " · " + esc(r.name) : "") + "</div></div>" +
              '<button class="del" data-act="del-record" data-id="' + esc(r.id) + '" aria-label="删除">' + IC.trash + "</button>" +
            "</div>";
          }).join("") : '<div class="rec-empty">还没有记录，上传一次跑步文件试试。</div>') +
        "</div></div></div>";
  }

  /* ================= 账号弹层 ================= */
  function openAuth() {
    $("#authModal").classList.add("show");
    $("#authModal").setAttribute("aria-hidden", "false");
    document.body.classList.add("no-scroll");
    const m = $("#authMsg"); if (m) { m.textContent = ""; m.className = "auth-msg"; }
    const n = $("#authName"); if (n) { n.value = ""; setTimeout(function () { n.focus(); }, 60); }
    const p = $("#authPass"); if (p) p.value = "";
  }
  function closeAuth() {
    $("#authModal").classList.remove("show");
    $("#authModal").setAttribute("aria-hidden", "true");
    document.body.classList.remove("no-scroll");
  }
  function submitAuth() {
    const name = ($("#authName").value || "").trim();
    const pass = $("#authPass").value || "";
    const msg = $("#authMsg");
    if (!name) { msg.textContent = "请输入用户名"; msg.className = "auth-msg"; return; }
    if (name.length > 20) { msg.textContent = "用户名最多 20 个字符"; msg.className = "auth-msg"; return; }
    if (!pass) { msg.textContent = "请输入密码"; msg.className = "auth-msg"; return; }
    const u = DB.users[name];
    if (u) {
      if (hstr(u.salt + "|" + pass) !== u.h) {
        msg.textContent = "用户名已存在或密码错误";
        msg.className = "auth-msg";
        return;
      }
      loginAs(name, false);
      msg.textContent = "欢迎回来，" + name;
      msg.className = "auth-msg ok";
      setTimeout(function () { closeAuth(); toast("已登录：" + name); go(S.tab); }, 500);
      return;
    }
    DB.users[name] = makeUser(pass);
    loginAs(name, true);
    msg.textContent = "账号已创建，" + name;
    msg.className = "auth-msg ok";
    setTimeout(function () { closeAuth(); toast("已创建账号：" + name); go(S.tab); }, 500);
  }
  function openAccount() {
    if (!S.user) { openAuth(); return; }
    updateAuthUI();
    $("#acctStats").textContent = "打卡 " + Object.keys(S.checks).length + " 次 · 记录 " + S.records.length + " 条";
    $("#acctRows").innerHTML =
      '<div class="acct-row"><span>连续打卡</span><b>' + streak() + " 天</b></div>" +
      '<div class="acct-row"><span>5 公里 PB</span><b>' + (bestFor(5, S.records) ? fmtHMS(bestFor(5, S.records).sec) : "—") + "</b></div>" +
      '<div class="acct-row"><span>数据位置</span><b>本机浏览器</b></div>';
    $("#accountModal").classList.add("show");
    $("#accountModal").setAttribute("aria-hidden", "false");
    document.body.classList.add("no-scroll");
  }
  function closeAccount() {
    $("#accountModal").classList.remove("show");
    $("#accountModal").setAttribute("aria-hidden", "true");
    document.body.classList.remove("no-scroll");
  }

  /* ================= 日详情 ================= */
  let sheetCtx = null;
  function openDay(blockIdx, dayIdx) {
    const p = currentPlan();
    const bi = blockIdx == null ? S.block : blockIdx;
    const d = p.blocks[bi].days[dayIdx];
    if (!d) return;
    sheetCtx = { pi: p.key, bi: bi, di: dayIdx };
    const done = isDone(p.key, bi, dayIdx);
    const key = ckey(p.key, bi, dayIdx);
    const note = S.checkNotes[key] || "";
    $("#sheet").innerHTML =
      '<div class="sheet-grab"></div>' +
      '<div class="meta">' +
        '<span class="chip ' + (d.quality ? "chip-q" : /休息/.test(d.type) ? "chip-r" : "chip-e") + '">' + esc(d.type) + "</span>" +
        '<span style="font-size:12px;color:var(--muted)">' + esc(d.day) + " · " + esc(weekTitleParts(p.blocks[bi].title)[0]) + "</span>" +
      "</div>" +
      "<h3>" + esc(d.day) + "训练</h3>" +
      '<div class="body">' + esc(d.content) + "</div>" +
      '<div style="margin-top:14px"><label style="font-size:11.5px;font-weight:700;color:var(--muted)">备注（可选：体感、配速、跑量）</label>' +
        '<input id="checkNote" value="' + esc(note) + '" placeholder="例如：4:35 配速，腿有点沉" ' +
        'style="width:100%;margin-top:6px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13.5px;outline:none">' +
      "</div>" +
      '<div class="acts">' +
        '<button class="btn ' + (done ? "btn-ghost" : "btn-primary") + '" data-act="sheet-check" style="flex:1">' +
          (done ? "撤销打卡" : IC.check + " 完成打卡") + "</button>" +
        '<button class="btn" data-act="sheet-copy">' + IC.copy + "</button>" +
        '<button class="btn" data-act="sheet-close">关闭</button>' +
      "</div>";
    $("#sheet").classList.add("show");
    $("#backdrop").classList.add("show");
    document.body.classList.add("no-scroll");
    const ni = $("#checkNote");
    if (ni) {
      ni.addEventListener("input", function () {
        if (ni.value) S.checkNotes[key] = ni.value; else delete S.checkNotes[key];
        save();
      });
    }
  }
  function closeSheet() {
    $("#sheet").classList.remove("show");
    $("#backdrop").classList.remove("show");
    document.body.classList.remove("no-scroll");
    sheetCtx = null;
  }

  /* ================= 动作 ================= */
  function toggleCheck(pi, bi, di) {
    const k = ckey(pi, bi, di);
    if (S.checks[k]) delete S.checks[k];
    else S.checks[k] = Date.now();
    save();
  }
  function todayText() {
    const p = currentPlan();
    const d = p.blocks[S.block].days[todayIdx];
    return d.day + " · " + d.type + "\n" + d.content + "\n—— Beyond Best · " + p.key;
  }
  async function copyText(t) {
    try {
      await navigator.clipboard.writeText(t);
      toast("已复制");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制"); } catch (e2) { toast("复制失败，请长按选择"); }
      ta.remove();
    }
  }

  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-act]");
    const tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) { go(tabBtn.dataset.tab); return; }
    if (!t) return;
    const act = t.dataset.act;
    const p = currentPlan();

    if (act === "day") {
      openDay(t.dataset.block != null ? +t.dataset.block : S.block, +t.dataset.day);
    } else if (act === "check-today") {
      toggleCheck(p.key, S.block, todayIdx);
      renderToday();
      toast(isDone(p.key, S.block, todayIdx) ? "今日打卡完成" : "已撤销");
    } else if (act === "copy-today") {
      copyText(todayText());
    } else if (act === "open-today") {
      openDay(S.block, todayIdx);
    } else if (act === "sheet-check") {
      if (sheetCtx) {
        toggleCheck(sheetCtx.pi, sheetCtx.bi, sheetCtx.di);
        const done = isDone(sheetCtx.pi, sheetCtx.bi, sheetCtx.di);
        const btn = $('[data-act="sheet-check"]');
        if (btn) {
          btn.className = "btn " + (done ? "btn-ghost" : "btn-primary");
          btn.style.flex = "1";
          btn.innerHTML = done ? "撤销打卡" : IC.check + " 完成打卡";
        }
        toast(done ? "打卡完成" : "已撤销");
        if (S.tab === "today") renderToday();
        if (S.tab === "plan") renderPlan();
        if (S.tab === "records") renderRecords();
      }
    } else if (act === "sheet-close") {
      closeSheet();
    } else if (act === "sheet-copy") {
      if (sheetCtx) {
        const d = planByKey(sheetCtx.pi).blocks[sheetCtx.bi].days[sheetCtx.di];
        copyText(d.day + " · " + d.type + "\n" + d.content);
      }
    } else if (act === "goto-pace") {
      go("pace");
    } else if (act === "goto-plan") {
      go("plan");
    } else if (act === "goto-records") {
      closeAccount(); go("records");
    } else if (act === "print") {
      doPrint();
    } else if (act === "copy-pace") {
      const t15 = parseTime(S.pb1500) || 270, t5 = parseTime(S.pb5000) || 1020;
      const lines = ["我的配速卡 · Beyond Best", "1500 米 " + S.pb1500 + "｜5000 米 " + S.pb5000, ""];
      MID_OFF.forEach(function (x) {
        lines.push("中距离 " + x[0] + "：" + fmt(t15 / 1.5 + x[1]) + "/km（400 米 " + fmt((t15 / 1.5 + x[1]) * 0.4) + "）");
      });
      lines.push("");
      LONG_OFF.forEach(function (x) {
        lines.push("长距离 " + x[0] + "：" + fmt(t5 / 5 + x[1]) + "/km（400 米 " + fmt((t5 / 5 + x[1]) * 0.4) + "）");
      });
      copyText(lines.join("\n"));
    } else if (act === "theme") {
      toggleTheme();
    } else if (act === "open-search") {
      openSearch();
    } else if (act === "close-search") {
      closeSearch();
    } else if (act === "sr") {
      gotoResult(t.dataset.i);
    } else if (act === "open-auth") {
      openAccount();
    } else if (act === "close-auth") {
      closeAuth();
    } else if (act === "auth-submit") {
      submitAuth();
    } else if (act === "close-account") {
      closeAccount();
    } else if (act === "logout") {
      logout(); closeAccount();
      toast("已退出登录");
      if (S.tab === "records") renderRecords();
    } else if (act === "pick-file") {
      const fi = $("#fileInput");
      if (fi) fi.click();
    } else if (act === "add-record") {
      const date = $("#rDate").value || dstr(new Date());
      const km = parseFloat($("#rKm").value);
      const sec = parseTime($("#rTime").value);
      if (!km || !sec) { toast("填一下距离和用时，例如 5 / 17:32"); return; }
      importRecords([{ date: date, km: km, sec: sec, src: "手动" }]);
    } else if (act === "del-record") {
      const id = t.dataset.id;
      const idx = S.records.findIndex(function (r) { return r.id === id; });
      if (idx >= 0) S.records.splice(idx, 1);
      save(); renderRecords(); toast("已删除");
    } else if (act === "use-pb") {
      const b = bestFor(5, S.records);
      if (b) { S.pb5000 = fmtHMS(b.sec); save(); toast("已更新 5000 米成绩"); go("pace"); }
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "gsearch") renderSearch(e.target.value);
  });

  document.addEventListener("keydown", function (e) {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === "Escape") {
      closeSheet();
      if ($("#searchModal").classList.contains("show")) closeSearch();
      if ($("#authModal").classList.contains("show")) closeAuth();
      if ($("#accountModal").classList.contains("show")) closeAccount();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault(); openSearch(); return;
    }
    if (typing) {
      if (e.key === "Enter" && e.target.id === "authPass") submitAuth();
      if (e.key === "Enter" && e.target.id === "gsearch") {
        const first = $(".sitem");
        if (first) first.click();
      }
      return;
    }
    if (e.key === "/") { e.preventDefault(); openSearch(); return; }
    const map = { "1": "today", "2": "plan", "3": "pace", "4": "records", "5": "notes" };
    if (map[e.key]) go(map[e.key]);
    if (e.key === "d" || e.key === "D") toggleTheme();
  });

  $("#backdrop").addEventListener("click", closeSheet);
  $$(".modal").forEach(function (m) {
    m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("show"); });
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "fileInput" && e.target.files && e.target.files[0]) {
      readRecordFile(e.target.files[0]);
      e.target.value = "";
    }
  });
  document.addEventListener("dragover", function (e) {
    const z = e.target.closest ? e.target.closest("#dropZone") : null;
    if (z) { e.preventDefault(); z.classList.add("hot"); }
  });
  document.addEventListener("dragleave", function (e) {
    const z = e.target.closest ? e.target.closest("#dropZone") : null;
    if (z) z.classList.remove("hot");
  });
  document.addEventListener("drop", function (e) {
    const z = e.target.closest ? e.target.closest("#dropZone") : null;
    if (!z) return;
    e.preventDefault(); z.classList.remove("hot");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readRecordFile(f);
  });

  /* ================= 启动 ================= */
  applyTheme();
  updateAuthUI();
  const wk = $("#weekmeta");
  if (wk) wk.textContent = S.plan + " · 第 " + (S.block + 1) + " 周";
  const hashTab = (location.hash || "").slice(1);
  if (["today", "plan", "pace", "records", "notes"].indexOf(hashTab) >= 0) S.tab = hashTab;
  try {
    const qs = new URLSearchParams(location.search);
    const th = qs.get("theme");
    if (th === "light" || th === "dark") { S.theme = th; applyTheme(); }
  } catch (e) {}
  window.__q = window.__q || "";
  go(S.tab, { keepScroll: true });
})();
</script>
</body>
</html>
