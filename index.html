            <div class="week-badge">${doneCount(p.key, i)}/7 已完成</div></div>
            <div class="week-sub">${esc(parts[1])}</div></div></div>`;
        }).join("")}
      </div>
      <div class="section"><div class="section-head"><h2>工具</h2></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" data-act="goto" data-view="pace">配速换算</button>
          <button class="btn" data-act="goto" data-view="records">打卡与记录</button>
          <button class="btn" data-act="open-search">搜索全站</button>
          <button class="btn" data-act="print">打印 / 存 PDF</button>
        </div></div>`;

    const sp = $("#sel-plan"), sb = $("#sel-block");
    const wm = $("#weekmeta"); if (wm) wm.textContent = p.key + " · 第 " + (S.block + 1) + " 周";
    if (sp) sp.addEventListener("change", () => { S.plan = sp.value; S.block = 0; savePrefs(); renderToday(); });
    if (sb) sb.addEventListener("change", () => { S.block = +sb.value; savePrefs(); renderToday(); });
  }

  function planCard(cur, b, bi, q) {
    const parts = weekParts(b.title);
    const days = b.days.map((d, di) => Object.assign({}, d, { di })).filter((d) =>
      !q || (d.type + d.content + d.day).toLowerCase().indexOf(q.toLowerCase()) >= 0);
    if (!days.length) return "";
    const isCur = bi === S.block;
    return `<div class="card week-card" ${isCur ? 'style="border-color:rgba(75,123,236,.45)"' : ""}>
      <div class="week-head"><div class="week-top">
        <div class="week-title"><span class="wname">${esc(parts[0])}</span>${isCur ? ' <span class="chip chip-brand" style="margin-left:6px">今日所在</span>' : ""}</div>
        <div class="week-badge">${doneCount(cur.key, bi)}/7 已完成</div></div>
        <div class="week-sub">${esc(parts[1])}</div></div>
      <div class="days">${days.map((d) => {
        const rest = /休息/.test(d.type), done = isDone(cur.key, bi, d.di);
        return `<div class="day${isCur && d.di === todayIdx ? " is-today" : ""}${rest ? " is-rest" : ""}" data-act="day" data-day="${d.di}" data-block="${bi}">
          <div class="day-w">${esc(d.day)}</div>
          <div class="day-main"><div class="day-line">
            <span class="chip ${d.quality ? "chip-q" : rest ? "chip-r" : "chip-e"}">${esc(d.type)}</span>
            ${done ? '<span class="chip" style="background:var(--teal-soft);color:var(--teal)">已打卡</span>' : ""}</div>
            <div class="day-content">${esc(d.content)}</div></div></div>`;
      }).join("")}</div></div>`;
  }

  function renderPlan() {
    const cur = planByKey(S.plan);
    const q0 = (window.__q || "").trim();
    $("#view-plan").innerHTML = `
      <div class="eyebrow">Training plan</div>
      <h1 class="page-title">${esc(cur.key)}</h1>
      <p class="page-sub">共 ${cur.blocks.length} 个周模板 · 内容与 Excel 课表一致</p>
      <div class="filter-row">
        <div class="seg" id="seg-group">${groups.map((g) => `<button data-group="${g}" class="${g === cur.group ? "is-active" : ""}">${g}</button>`).join("")}</div>
        <div class="search"><input id="q" type="search" placeholder="搜索：阈值 / 力量 / 休息" value="${esc(q0)}" autocomplete="off"></div>
      </div>
      ${(cur.group === "中距离" || cur.group === "长距离") ? `<div class="filter-row" style="margin-top:-8px"><div class="seg" id="seg-phase">
        ${phaseList(cur.group).map((p) => `<button data-plan="${esc(p.key)}" class="${p.key === cur.key ? "is-active" : ""}">${esc(p.phase)}</button>`).join("")}</div></div>` : ""}
      <div id="plan-list"></div>
      <div class="section-head" style="margin-top:26px"><h2>提示</h2></div>
      <div class="notes-card">质量课日期不要随意挪动；两节质量课之间至少隔 48 小时。状态不好时把当天质量课降级为轻松跑，不要在同一周补课。</div>`;
    const paint = () => {
      const list = $("#plan-list"); if (!list) return;
      const q = (window.__q || "").trim();
      const body = cur.blocks.map((b, bi) => planCard(cur, b, bi, q)).join("");
      let n = 0;
      if (q) cur.blocks.forEach((b) => b.days.forEach((d) => {
        if ((d.type + d.content + d.day).toLowerCase().indexOf(q.toLowerCase()) >= 0) n++;
      }));
      list.innerHTML = (q ? `<div class="search-meta">「${esc(q)}」匹配到 ${n} 个训练日</div>` : "") +
        (body || '<div class="empty-state">没有匹配的训练日</div>');
    };
    const wm = $("#weekmeta"); if (wm) wm.textContent = cur.key + " · 第 " + (S.block + 1) + " 周";
    $$("#seg-group button").forEach((b) => b.addEventListener("click", () => {
      const g = b.dataset.group;
      S.plan = (g === "中距离" || g === "长距离")
        ? (phaseList(g).find((x) => x.phase === "基础期") || phaseList(g)[0]).key
        : phaseList(g)[0].key;
      S.block = 0; savePrefs(); renderPlan();
    }));
    $$("#seg-phase button").forEach((b) => b.addEventListener("click", () => { S.plan = b.dataset.plan; S.block = 0; savePrefs(); renderPlan(); }));
    const qi = $("#q");
    if (qi) {
      let composing = false;
      qi.addEventListener("compositionstart", () => { composing = true; });
      qi.addEventListener("compositionend", () => { composing = false; window.__q = qi.value; paint(); });
      qi.addEventListener("input", (e) => { if (composing || e.isComposing) return; window.__q = qi.value; paint(); });
    }
    paint();
  }

  /* 配速：与之前一致，略 */
  const MID_OFF = [["轻松跑", 110], ["长距离有氧", 125], ["阈值跑", 30], ["VO2max 间歇", 15], ["乳酸耐受", 0], ["速度耐力", -10]];
  const LONG_OFF = [["轻松跑", 70], ["长距离有氧", 80], ["阈值跑", 14], ["VO2max 间歇", -5], ["10000 米配速", 9], ["半马配速", 16]];
  function renderPace() {
    const t15 = parseTime(S.pb1500) || 270, t5 = parseTime(S.pb5000) || 1020;
    const p15 = t15 / 1.5, p5 = t5 / 5;
    const rows = (arr, base) => arr.map(([k, off]) => {
      const v = base + off;
      return `<div class="pace-item"><div class="k">${esc(k)}</div>
        <div class="v">${fmt(v)}<span style="font-size:11px;font-weight:600;color:var(--muted)">/km</span></div>
        <div class="s">400 米 ${fmt(v * 0.4)}</div></div>`;
    }).join("");
    const blocks = DATA.pace.blocks.map((b) => {
      if (b.type === "steps") return `<div class="section"><div class="section-head"><h2>${esc(b.title)}</h2></div>
        <div class="steps">${b.items.map((it) => `<div class="step"><div class="lbl">${esc(it.label)}</div><div>${esc(it.text)}</div></div>`).join("")}</div></div>`;
      if (b.type === "rules") return `<div class="section"><div class="section-head"><h2>${esc(b.title)}</h2></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr>${b.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map((r) => `<tr>${r.map((c, i) => `<td${i === 3 ? ' style="min-width:280px"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
      if (b.type === "grid") {
        const is15 = /1500/.test(b.head[0]); const anchor = is15 ? t15 : t5;
        let best = -1, bd = 1e9;
        b.rows.forEach((r, i) => { const v = parseTime(r[0]); if (v == null) return; if (Math.abs(v - anchor) < bd) { bd = Math.abs(v - anchor); best = i; } });
        return `<div class="section"><div class="section-head"><h2>${esc(b.title)}</h2><span class="hint">高亮 = 最接近你的成绩</span></div>
          <div class="tbl-wrap"><table class="tbl num"><thead><tr>${b.head.map((h) => `<th style="text-align:center">${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>${b.rows.map((r, i) => `<tr class="${i === best ? "near" : ""}">${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
      }
      if (b.type === "section") return `<div class="section"><div class="section-head"><h2>${esc(b.title)}</h2></div>
        <div class="bullets">${b.items.map((it) => `<div>${esc(it.text)}</div>`).join("")}</div></div>`;
      return "";
    }).join("");
    $("#view-pace").innerHTML = `
      <div class="eyebrow">Pace</div><h1 class="page-title">配速换算</h1><p class="page-sub">${esc(DATA.pace.title)}</p>
      <div class="card pb-card"><div class="pb-row">
        <div class="field"><label>1500 米成绩</label><input id="pb15" value="${esc(S.pb1500)}" placeholder="4:30"></div>
        <div class="field"><label>5000 米成绩</label><input id="pb5" value="${esc(S.pb5000 || "")}" placeholder="17:00"></div></div>
        <div class="calc-note">格式 mm:ss，改完立即重算。</div></div>
      <div class="section"><div class="section-head"><h2>中距离 800 / 1500</h2><span class="hint" id="h15">P1500 = ${fmt(p15)}/km</span></div>
        <div class="pace-out" id="out15">${rows(MID_OFF, p15)}</div></div>
      <div class="section"><div class="section-head"><h2>长距离 5000 / 10000 / 半马</h2><span class="hint" id="h5">P5k = ${fmt(p5)}/km</span></div>
        <div class="pace-out" id="out5">${rows(LONG_OFF, p5)}</div></div>
      <div class="section"><button class="btn btn-primary" data-act="copy-pace">复制配速卡</button></div>${blocks}`;
    const bind = (id, key, out, hint, offs, div) => {
      const el = $(id); if (!el) return;
      el.addEventListener("input", () => {
        S[key] = el.value; savePrefs();
        const t = parseTime(el.value) || (div === 1.5 ? 270 : 1020);
        const base = t / div;
        const o = $(out); if (o) o.innerHTML = rows(offs, base);
        const h = $(hint); if (h) h.textContent = (div === 1.5 ? "P1500 = " : "P5k = ") + fmt(base) + "/km";
      });
    };
    bind("#pb15", "pb1500", "#out15", "#h15", MID_OFF, 1.5);
    bind("#pb5", "pb5000", "#out5", "#h5", LONG_OFF, 5);
  }

  let openAcc = 0;
  function renderNotes() {
    let i = -1;
    const html = DATA.notes.map((n) => {
      if (n.kind === "section") {
        i++;
        return `<div class="acc${i === openAcc ? " is-open" : ""}" data-acc="${i}">
          <div class="acc-head">${esc(n.title)}<span class="arw">▾</span></div>
          <div class="acc-body" data-body="${i}"></div></div>`;
      }
      return `<div class="nrow" data-for="${i}"><div class="lbl">${esc(n.label)}</div><div>${esc(n.text)}</div></div>`;
    }).join("");
    $("#view-notes").innerHTML = `<div class="eyebrow">Manual</div><h1 class="page-title">训练说明</h1>
      <p class="page-sub">训练类型、配速推断、周期安排、力量组次、安全提示</p>${html}`;
    $$("#view-notes .nrow").forEach((w) => { const b = $(`[data-body="${w.dataset.for}"]`); if (b) b.appendChild(w); });
    $$(".acc-head").forEach((h) => h.addEventListener("click", () => {
      const acc = h.parentElement, was = acc.classList.contains("is-open");
      $$(".acc").forEach((a) => a.classList.remove("is-open"));
      if (!was) acc.classList.add("is-open");
    }));
  }

  /* ================= 记录 ================= */
  function renderRecords() {
    const recs = state.records;
    const checks = state.checks;
    const total = Object.keys(checks).length;
    const pbs = STD.map((s) => ({ name: s.name, rec: bestFor(s.km, recs) }));
    const today = new Date(), start = new Date(today);
    start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - 11 * 7);
    const counts = {};
    Object.keys(checks).forEach((k) => { const d = dstr(new Date(checks[k])); counts[d] = (counts[d] || 0) + 1; });
    let cells = "";
    for (let w = 0; w < 12; w++) for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
      const n = counts[dstr(day)] || 0;
      const lv = n === 0 ? "" : n === 1 ? "l1" : n === 2 ? "l2" : n === 3 ? "l3" : "l4";
      cells += `<i class="hm-cell ${lv}" title="${dstr(day)}${n ? " · 打卡 " + n + " 次" : ""}"></i>`;
    }
    $("#view-records").innerHTML = `
      <div class="eyebrow">Records</div>
      <div class="rec-head">
        <div><h1 class="page-title">打卡与记录</h1>
          <p class="page-sub">${logged() ? "账号：" + esc(state.profile.username) : "未登录 · 数据存在本机"} · 打卡 ${total} 次 · 连续 ${streak()} 天</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-act="pick-shot">上传跑步截图</button></div>
      </div>
      <div class="section"><div class="section-head"><h2>个人最好成绩</h2><span class="hint">自动识别 ±3%</span></div>
        <div class="pb-grid">${pbs.map((p) => p.rec
          ? `<div class="pb-item has"><div class="k">${p.name}</div><div class="v">${fmtHMS(p.rec.sec)}</div><div class="s">${esc(p.rec.date)} · ${(+p.rec.km).toFixed(2)} km</div></div>`
          : `<div class="pb-item empty"><div class="k">${p.name}</div><div class="v">暂无</div><div class="s">—</div></div>`).join("")}</div>
        ${bestFor(5, recs) ? `<div style="margin-top:12px"><button class="btn btn-sm" data-act="use-pb">用 5 公里 PB（${fmtHMS(bestFor(5, recs).sec)}）更新配速</button></div>` : ""}
      </div>
      <div class="section"><div class="section-head"><h2>打卡日历</h2><span class="hint">最近 12 周</span></div>
        <div class="card" style="padding:16px 18px"><div class="hm">${cells}</div></div></div>
      <div class="section"><div class="section-head"><h2>添加记录</h2><span class="hint">截图 + 手填数字</span></div>
        <div class="card"><div class="shot-pick">
          <div class="shot-box" data-act="pick-shot"><img id="shotPreview" style="display:none" alt=""><span class="shot-plus" id="shotPlus">+</span></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px">选一张跑步截图</div>
            <div class="small muted" style="margin-top:4px">Keep、悦跑圈、手表 App 的成绩页都行，截图会作为这条记录的凭证。</div>
            <div class="row-2" style="margin-top:10px">
              <input class="input" id="rKm" type="number" step="0.01" placeholder="距离 km">
              <input class="input" id="rTime" placeholder="用时 17:32"></div>
            <div class="row-2" style="margin-top:10px">
              <input class="input" id="rDate" type="date" value="${dstr(new Date())}">
              <button class="btn" data-act="add-record">保存记录</button></div>
          </div></div></div></div>
      <div class="section"><div class="section-head"><h2>跑步记录</h2><span class="hint">${recs.length} 条</span></div>
        <div class="card" style="padding:0">
          ${recs.length ? recs.map((r) => {
            const isPB = STD.some((s) => Math.abs(r.km - s.km) / s.km <= 0.03 && bestFor(s.km, recs) === r);
            return `<div class="rec">${r.shot ? `<img class="rec-shot" src="${r.shot}" data-shot="${r.id}" alt="">` : ""}
              <div class="when">${esc(r.date)}</div>
              <div class="main"><div class="t">${(+r.km).toFixed(2)} km · ${fmtHMS(r.sec)}
                <span class="sub">${fmt(r.sec / r.km)}/km</span>${isPB ? '<span class="pb-badge">PB</span>' : ""}</div>
                <div class="sub">${esc(r.src || "手动")}</div></div>
              <button class="icon-btn" data-act="del-record" data-id="${r.id}" aria-label="删除">✕</button></div>`;
          }).join("") : '<div class="rec-empty">还没有记录，先上传一张截图</div>'}
        </div></div>`;
    $$("#view-records [data-shot]").forEach((img) => img.addEventListener("click", () => {
      const r = recs.find((x) => x.id === img.dataset.shot);
      if (r && r.shot) window.open(r.shot, "_blank");
    }));
  }
  let pendingShot = "";

  /* ================= 广场 ================= */
  let plazaFilter = { q: "", from: "", to: "" };

  function plazaCardHTML(p) {
    const me = state.profile;
    const mine = me && p.author_id === me.id;
    const joined = !!state.myJoins[p.id];
    const n = state.joinCounts[p.id] || 0;
    return `<div class="card plaza-card">
      <div class="plaza-head">
        ${avatarHTML(p.author_avatar, p.author_name, "", "width:30px;height:30px;font-size:12px")}
        <div style="flex:1"><div style="font-weight:700;font-size:12.5px">${esc(p.author_name)}</div>
        <div class="small muted">${timeAgo(Date.parse(p.created_at))}</div></div>
        ${mine ? '<span class="badge user">我发的</span>' : ""}
      </div>
      <div class="plaza-title">${esc(p.title)}</div>
      <div class="plaza-meta"><span>📍 ${esc(p.place)}</span><span>🕒 ${esc(p.run_time)}</span></div>
      <div class="plaza-body">${esc(p.content)}</div>
      <div class="plaza-foot">
        <div class="plaza-tags">
          ${p.distance ? `<span class="chip chip-r">${esc(p.distance)}</span>` : ""}
          ${p.pace ? `<span class="chip chip-r">${esc(p.pace)}</span>` : ""}
          <span class="chip chip-e" ${mine ? `data-act="view-joins" data-id="${p.id}" style="cursor:pointer"` : ""}>${n} 人申请${mine ? " · 点击查看" : ""}</span>
        </div>
        <div class="plaza-acts">
          ${mine ? `<button class="btn btn-sm" data-act="view-joins" data-id="${p.id}">查看申请${n ? "（" + n + "）" : ""}</button>` : ""}
          ${mine || admin() ? `<button class="btn btn-sm" data-act="del-post" data-id="${p.id}">删除</button>` : ""}
          ${mine ? "" : `<button class="btn btn-sm ${joined ? "" : "primary"}" data-act="join-post" data-id="${p.id}" ${joined ? "disabled" : ""}>${joined ? "已申请" : "申请加入"}</button>`}
        </div>
      </div>
      ${p.contact && (joined || mine || admin()) ? `<div class="small muted">联系方式：${esc(p.contact)}</div>` : ""}
    </div>`;
  }

  function filteredPosts() {
    const q = (plazaFilter.q || "").trim().toLowerCase();
    return state.posts.filter((p) => {
      if (q) {
        const hay = (p.title + " " + p.place + " " + (p.content || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      if (plazaFilter.from || plazaFilter.to) {
        const day = p.run_at ? String(p.run_at).slice(0, 10) : "";
        if (!day) return false;
        if (plazaFilter.from && day < plazaFilter.from) return false;
        if (plazaFilter.to && day > plazaFilter.to) return false;
      }
      return true;
    });
  }

  function paintPlaza() {
    const box = $("#plazaList");
    if (!box) return;
    const list = filteredPosts();
    const filtering = plazaFilter.q || plazaFilter.from || plazaFilter.to;
    if (!list.length) {
      box.innerHTML = '<div class="empty-state">' +
        (filtering ? "没有符合条件的邀请，换个地点或时间试试" : "还没有人发邀请，等你发第一条") + "</div>";
      return;
    }
    box.innerHTML = (filtering ? `<div class="search-meta">找到 ${list.length} 条邀请</div>` : "") +
      '<div class="plaza-grid">' + list.map(plazaCardHTML).join("") + "</div>";
  }

  function renderPlaza() {
    const me = state.profile;
    $("#view-plaza").innerHTML = `
      <div class="rec-head"><div><div class="eyebrow">Plaza</div><h1 class="page-title">跑步广场</h1>
        <p class="page-sub">约跑、拉练、比赛同行，都可以发在这里</p></div>
        <button class="btn btn-primary" data-act="open-post">发布组队邀请</button></div>

      ${me ? "" : '<div class="card" style="padding:16px 18px;background:var(--surface-2)"><div class="small">登录后可发布邀请或申请加入；未登录可以浏览。</div><button class="btn btn-sm" style="margin-top:10px" data-act="open-auth">登录 / 注册</button></div>'}

      <div class="plaza-filter">
        <input class="q" id="plazaQ" type="search" placeholder="搜地点或标题，例如：奥体 / 操场" value="${esc(plazaFilter.q)}">
        <input type="date" id="plazaFrom" value="${esc(plazaFilter.from)}" aria-label="起始日期">
        <span class="sep">至</span>
        <input type="date" id="plazaTo" value="${esc(plazaFilter.to)}" aria-label="结束日期">
        <button class="btn btn-sm" data-act="plaza-clear">清除</button>
      </div>

      <div id="plazaList"></div>`;

    const q = $("#plazaQ");
    if (q) q.addEventListener("input", function () { plazaFilter.q = q.value; paintPlaza(); });
    const f = $("#plazaFrom");
    if (f) f.addEventListener("change", function () { plazaFilter.from = f.value; paintPlaza(); });
    const t2 = $("#plazaTo");
    if (t2) t2.addEventListener("change", function () { plazaFilter.to = t2.value; paintPlaza(); });

    paintPlaza();
  }

  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < 3600000) return Math.max(1, Math.round(d / 60000)) + " 分钟前";
    if (d < 86400000) return Math.round(d / 3600000) + " 小时前";
    if (d < 86400000 * 7) return Math.round(d / 86400000) + " 天前";
    const x = new Date(ts);
    return (x.getMonth() + 1) + "/" + x.getDate();

  /* ================= 搜索 ================= */
  let INDEX = null;
  function getIndex() {
    if (INDEX) return INDEX;
    const list = [];
    DATA.plans.forEach((p) => p.blocks.forEach((b, bi) => b.days.forEach((d, di) => {
      list.push({ kind: "课表", cls: "", title: p.key + " · " + weekParts(b.title)[0] + " · " + d.day,
        text: d.type + "：" + d.content, go: { view: "plan", plan: p.key, block: bi, day: di } });
    })));
    DATA.pace.blocks.forEach((b, bi) => {
      (b.rows || []).forEach((r) => list.push({ kind: "配速", cls: "pace", title: b.title + " · " + r[0], text: r.slice(1).join("　"), go: { view: "pace", sec: bi } }));
      (b.items || []).forEach((it) => list.push({ kind: "配速", cls: "pace", title: it.label || b.title, text: it.text || "", go: { view: "pace", sec: bi } }));
    });
    let sec = -1;
    DATA.notes.forEach((n) => {
      if (n.kind === "section") { sec++; list.push({ kind: "说明", cls: "note", title: n.title, text: "", go: { view: "notes", sec } }); }
      else list.push({ kind: "说明", cls: "note", title: n.label, text: n.text, go: { view: "notes", sec } });
    });
    [["配速换算", "输入 1500 / 5000 成绩换算强度", "pace"], ["打卡与记录", "打卡日历、截图、PB", "records"],
     ["跑步广场", "发布组队邀请", "plaza"], ["训练说明", "力量组次与安全提示", "notes"]].forEach((x) => {
      list.push({ kind: "工具", cls: "tool", title: x[0], text: x[1], go: { view: x[2] } });
    });
    INDEX = list;
    return list;
  }
  function renderSearch(q) {
    const box = $("#searchResults"); if (!box) return;
    q = (q || "").trim();
    if (!q) { box.innerHTML = '<div class="sempty">输入关键词：阈值 / 力量 / 配速 / 打卡</div>'; return; }
    const k = q.toLowerCase();
    const hits = getIndex().filter((e) => (e.title + " " + e.text).toLowerCase().indexOf(k) >= 0).slice(0, 60);
    if (!hits.length) { box.innerHTML = '<div class="sempty">没有找到「' + esc(q) + '」</div>'; return; }
    const mark = (t) => {
      const s = String(t || ""), i = s.toLowerCase().indexOf(k);
      return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
    };
    const order = ["课表", "配速", "说明", "工具"];
    let html = "";
    order.forEach((kind) => {
      const sub = hits.filter((e) => e.kind === kind); if (!sub.length) return;
      html += '<div class="sgroup">' + kind + " · " + sub.length + "</div>";
      sub.slice(0, 20).forEach((e) => {
        html += `<div class="sitem" data-act="sr" data-i="${getIndex().indexOf(e)}"><span class="tag ${e.cls}">${kind}</span>
          <div><div class="tt">${mark(e.title)}</div>${e.text ? '<div class="tx">' + mark(e.text) + "</div>" : ""}</div></div>`;
      });
    });
    box.innerHTML = html;
  }
  function openSearch() { closeModals("searchModal"); $("#searchModal").classList.add("show"); document.body.classList.add("no-scroll"); const i = $("#gsearch"); i.value = ""; renderSearch(""); setTimeout(() => i.focus(), 40); }
  function closeSearch() { $("#searchModal").classList.remove("show"); document.body.classList.remove("no-scroll"); }
  function gotoResult(i) {
    const e = getIndex()[i]; if (!e) return;
    closeSearch();
    if (e.go.view === "plan") {
      S.plan = e.go.plan; S.block = e.go.block; savePrefs(); go("plan");
      setTimeout(() => {
        const el = $('.day[data-block="' + e.go.block + '"][data-day="' + e.go.day + '"]');
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
      }, 120);
      return;
    }
    go(e.go.view);
  }

  /* ================= 路由 ================= */
  let VIEW = "today";
  function renderCurrent() {
    if (VIEW === "today") renderToday();
    else if (VIEW === "plan") renderPlan();
    else if (VIEW === "plaza") renderPlaza();
    else if (VIEW === "records") renderRecords();
    else if (VIEW === "me") renderMe();
    else if (VIEW === "pace") renderPace();
    else if (VIEW === "notes") renderNotes();
    else if (VIEW === "admin") renderAdmin();
  }
  function go(view, opts) {
    VIEW = view;
    $$(".view").forEach((v) => v.classList.toggle("is-active", v.id === "view-" + view));
    $$("[data-tab]").forEach((b) => b.classList.toggle("is-active", b.dataset.tab === view));
    renderCurrent();
    if (view === "plaza") loadPlaza().then(renderPlaza);
    if (view === "admin") loadAdmin().catch((e) => toast(e.message));
    if (!(opts && opts.keep)) window.scrollTo({ top: 0, behavior: "smooth" });
    if (location.hash.slice(1) !== view) { try { history.replaceState(null, "", "#" + view); } catch (e) {} }
  }

  /* ================= 弹层 ================= */
  let sheetCtx = null;
  function openDay(bi, di) {
    const p = planByKey(S.plan);

    const d = p.blocks[bi].days[di]; if (!d) return;
    sheetCtx = { pi: p.key, bi, di };
    const done = isDone(p.key, bi, di);
    const note = state.notes[ckey(p.key, bi, di)] || "";
    $("#sheet").innerHTML = `<div class="sheet-grab"></div>
      <div class="meta"><span class="chip ${d.quality ? "chip-q" : "chip-e"}">${esc(d.type)}</span>

  /* ================= 动作 ================= */
  document.addEventListener("click", async (e) => {
    const tab = e.target.closest("[data-tab]");
    if (tab) { go(tab.dataset.tab); return; }
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;

    if (act === "goto") go(t.dataset.view);
    else if (act === "open-search") openSearch();
    else if (act === "close-search") closeSearch();
    else if (act === "sr") gotoResult(+t.dataset.i);
    else if (act === "toggle-mode") { S.mode = S.mode === "dark" ? "light" : "dark"; savePrefs(); applyTheme(); renderCurrent(); }
    else if (act === "set-theme") { S.theme = t.dataset.id; savePrefs(); applyTheme(); renderMe(); }
    else if (act === "pick-bg") pickBg();
    else if (act === "clear-bg") { S.bg = ""; savePrefs(); applyTheme(); renderMe(); }
    else if (act === "open-auth") openAuth("login");
    else if (act === "close-auth") closeAuth();
    else if (act === "open-account") openAccount();
    else if (act === "close-account") closeAccount();
    else if (act === "goto-me") { closeAccount(); go("me"); }
    else if (act === "goto-forgot") switchAuth("forgot");
    else if (act === "goto-login") switchAuth("login");
    else if (act === "do-login") doLogin();
    else if (act === "do-register") doRegister();
    else if (act === "do-forgot") doForgot();
    else if (act === "do-reset") doReset();
    else if (act === "change-pass") openChangePass();
    else if (act === "logout") { await signOut(); toast("已退出"); }
    else if (act === "delete-account") doDeleteAccount();
    else if (act === "check-today") {
      const p = planByKey(S.plan);
      const on = await toggleCheck(p.key, S.block, todayIdx);
      renderToday(); toast(on ? "已打卡" : "已撤销");
    } else if (act === "copy-today") {
      const p = planByKey(S.plan), d = p.blocks[S.block].days[todayIdx];
      copy(d.day + " · " + d.type + "\n" + d.content + "\n—— Beyond Best · " + p.key);
    } else if (act === "open-today") openDay(S.block, todayIdx);
    else if (act === "day") openDay(t.dataset.block != null ? +t.dataset.block : S.block, +t.dataset.day);
    else if (act === "sheet-close") closeSheet();
    else if (act === "sheet-check") {
      if (sheetCtx) {
        const on = await toggleCheck(sheetCtx.pi, sheetCtx.bi, sheetCtx.di);
        const btn = $('[data-act="sheet-check"]');
        if (btn) { btn.className = "btn " + (on ? "" : "btn-primary"); btn.textContent = on ? "撤销打卡" : "完成打卡"; }
        toast(on ? "打卡完成" : "已撤销");
        if (VIEW === "today") renderToday(); if (VIEW === "plan") renderPlan();
      }
    } else if (act === "sheet-copy") {
      if (sheetCtx) {
        const d = planByKey(sheetCtx.pi).blocks[sheetCtx.bi].days[sheetCtx.di];
        copy(d.day + " · " + d.type + "\n" + d.content);
      }
    } else if (act === "copy-pace") {
      const t15 = parseTime(S.pb1500) || 270, t5 = parseTime(S.pb5000) || 1020;
      const lines = ["我的配速卡 · Beyond Best", "1500 米 " + S.pb1500 + "｜5000 米 " + (S.pb5000 || ""), ""];
      MID_OFF.forEach((x) => lines.push("中距离 " + x[0] + "：" + fmt(t15 / 1.5 + x[1]) + "/km"));
      lines.push("");
      LONG_OFF.forEach((x) => lines.push("长距离 " + x[0] + "：" + fmt(t5 / 5 + x[1]) + "/km"));
      copy(lines.join("\n"));
    } else if (act === "print") window.print();
    else if (act === "pick-shot") pickShot();
    else if (act === "add-record") addRecord();
    else if (act === "del-record") {
      const id = t.dataset.id;
      state.records = state.records.filter((r) => r.id !== id);
      if (!logged()) { saveGuest(); renderRecords(); return; }
      try { await api("/rest/v1/records?id=eq." + id, { method: "DELETE" }); } catch (err) { toast("删除失败：" + err.message); }
      renderRecords();
    } else if (act === "use-pb") {
      const b = bestFor(5, state.records);
      if (b) { S.pb5000 = fmtHMS(b.sec); savePrefs(); toast("已更新 5000 米成绩"); go("pace"); }
    } else if (act === "open-post") {
      if (!logged()) { toast("先登录再发布"); openAuth("login"); return; }
      const now = new Date();
      $("#pTime").value = dstr(now) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
      $("#postModal").classList.add("show"); document.body.classList.add("no-scroll");
    } else if (act === "close-post") { $("#postModal").classList.remove("show"); document.body.classList.remove("no-scroll"); }
    else if (act === "do-post") doPost();
    else if (act === "join-post") doJoin(t.dataset.id);
    else if (act === "view-joins") openJoins(t.dataset.id);
    else if (act === "close-joins") closeJoins();
    else if (act === "pick-avatar") pickAvatar();
    else if (act === "plaza-clear") {
      plazaFilter = { q: "", from: "", to: "" };
      renderPlaza();
    }
    else if (act === "del-post") {
      const id = t.dataset.id;
      if (!confirm("删除这条邀请？")) return;
      try {
        await api("/rest/v1/posts?id=eq." + id, { method: "DELETE" });
        state.posts = state.posts.filter((p) => p.id !== id);
        toast("已删除");
        if (VIEW === "admin") loadAdmin(); else renderPlaza();
      } catch (err) { toast("删除失败：" + err.message); }
    } else if (act === "del-user") {
      toast("删除账号需要在 Supabase 后台操作（前端无权删除他人账号）");
    }
  });

  $$(".auth-tab").forEach((b) => b.addEventListener("click", () => switchAuth(b.dataset.authTab)));

  async function doLogin() {
    const name = $("#loginName").value, pass = $("#loginPass").value;
    const msg = $("#loginMsg"); msg.textContent = "登录中…";
    try {
      await signIn(name, pass);
      closeAuth(); closeAccount(); toast("欢迎回来"); go(VIEW, { keep: true });
    } catch (e) { msg.textContent = e.message || "用户名或密码错误"; }
  }
  async function doRegister() {
    const name = $("#regName").value, pass = $("#regPass").value, phone = ($("#regPhone").value || "").trim();
    const msg = $("#regMsg"); msg.textContent = "注册中…";
    try {
      await signUp(name, pass, phone);
      closeAuth(); closeAccount(); toast("注册成功，已登录"); go(VIEW, { keep: true });
    } catch (e) { msg.textContent = e.message; }
  }
  let forgotPhoneCache = "";
  async function doForgot() {
    const phone = ($("#forgotPhone").value || "").trim();
    const msg = $("#forgotMsg");
    if (!/^1\d{10}$/.test(phone)) { msg.textContent = "请输入 11 位手机号"; return; }
    msg.textContent = "查询中…";
    $("#forgotResult").style.display = "none";
    try {
      const name = await findAccount(phone);
      if (!name) { msg.textContent = "该手机号未注册"; return; }
      forgotPhoneCache = phone;
      msg.textContent = "";
      $("#forgotWho").textContent = "找到账号：" + name + "。设置新密码后即可登录（不会自动改密）。";
      $("#forgotNew").value = "";
      $("#forgotResult").style.display = "";
      setTimeout(function () { const el = $("#forgotNew"); if (el) el.focus(); }, 60);
    } catch (e) { msg.textContent = e.message || "查询失败"; }
  }

  async function doReset() {
    const msg = $("#forgotMsg");
    const pass = $("#forgotNew").value || "";
    const phone = ($("#forgotPhone").value || "").trim();
    if (!/^1\d{10}$/.test(phone)) { msg.textContent = "请输入 11 位手机号"; return; }
    if (!forgotPhoneCache) { msg.textContent = "请先点「找回账号」查询"; return; }
    if (pass.length < 6) { msg.textContent = "密码至少 6 位"; return; }
    msg.textContent = "重设中…";
    try {
      const name = await resetPasswordByPhone(phone, pass);
      if (!name) { msg.textContent = "该手机号未注册"; return; }
      await signIn(name, pass);
      closeAuth(); closeAccount();
      toast("密码已重设，已登录");
      go(VIEW, { keep: true });
    } catch (e) { msg.textContent = e.message || "重设失败"; }
  }
  async function doDeleteAccount() {
    if (!logged()) return;
    const ok = prompt("注销后，账号、打卡、跑步记录、广场邀请都会被永久删除，无法恢复。\n\n请输入「注销」两个字确认：");
    if (ok === null) return;
    if (String(ok).trim() !== "注销") { toast("输入不匹配，已取消"); return; }
    try {
      await deleteAccount();
      await signOut();
      toast("账号已注销");
      go("me");
    } catch (e) {
      toast("注销失败：" + e.message);
    }
  }

  function openChangePass() {
    const p = prompt("设置新密码（至少 6 位）");
    if (!p) return;
    changePassword(p).then(() => toast("密码已修改")).catch((e) => toast("修改失败：" + e.message));
  }

  function pickBg() {
    const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
    i.onchange = () => {
      const f = i.files[0]; if (!f) return;
      compress(f, (d) => { if (!d) { toast("图片读取失败"); return; } S.bg = d; savePrefs(); applyTheme(); renderMe(); toast("背景已设置"); });
    };
    i.click();
  }
  function pickShot() {
    const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
    i.onchange = () => {
      const f = i.files[0]; if (!f) return;
      compress(f, (d) => {
        if (!d) { toast("图片读取失败"); return; }
        pendingShot = d;
        const img = $("#shotPreview"), plus = $("#shotPlus");
        if (img) { img.src = d; img.style.display = ""; }
        if (plus) plus.style.display = "none";
        toast("截图已添加，填一下距离和用时");
      });
    };
    i.click();
  }
  async function addRecord() {
    const km = parseFloat($("#rKm").value), sec = parseTime($("#rTime").value);
    const date = $("#rDate").value || dstr(new Date());
    if (!km || !sec) { toast("填一下距离和用时"); return; }
    const before = STD.map((s) => bestFor(s.km, state.records));
    const rec = { id: uid(), date, km: +km.toFixed(3), sec: Math.round(sec), src: pendingShot ? "截图" : "手动", shot: pendingShot || "" };
    state.records.push(rec);
    state.records.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const after = STD.map((s) => bestFor(s.km, state.records));
    const news = [];
    after.forEach((a, i) => { if (a && (!before[i] || a.sec < before[i].sec)) news.push(STD[i].name + " " + fmtHMS(a.sec)); });
    if (logged()) {
      try {
        const row = await api("/rest/v1/records", {
          method: "POST",
          body: { user_id: state.profile.id, date, km: rec.km, sec: rec.sec, src: rec.src, shot: rec.shot || null },
          headers: { Prefer: "return=representation" }
        });
        if (row && row[0]) rec.id = row[0].id;
      } catch (e) { toast("同步失败：" + e.message); }
    } else saveGuest();
    const pb5 = bestFor(5, state.records);
    if (pb5) { S.pb5000 = fmtHMS(pb5.sec); savePrefs(); }
    pendingShot = "";
    renderRecords();
    toast(news.length ? "新 PB：" + news.join("、") : "已保存");
  }

  async function doPost() {
    if (!logged()) { toast("请先登录"); return; }
    const title = $("#pTitle").value.trim(), place = $("#pPlace").value.trim();
    const time = $("#pTime").value, content = $("#pContent").value.trim();
    if (!title || !place || !content || !time) { $("#postMsg").textContent = "标题、地点、时间、内容都要填"; return; }
    const dt = new Date(time);
    const runTime = (dt.getMonth() + 1) + " 月 " + dt.getDate() + " 日 " + pad(dt.getHours()) + ":" + pad(dt.getMinutes());
    try {
      const base = {
        author_id: state.profile.id, author_name: state.profile.username,
        title, place, run_time: runTime, content,
        distance: $("#pDistance").value.trim(), pace: $("#pPace").value.trim(),
        contact: $("#pContact").value.trim()
      };
      try {
        await api("/rest/v1/posts", {
          method: "POST",
          body: Object.assign({}, base, { author_avatar: state.profile.avatar_url || null, run_at: dt.toISOString() })
        });
      } catch (e) {
        if (!missingCol(e)) throw e;
        await api("/rest/v1/posts", { method: "POST", body: base });
      }
      ["#pTitle", "#pPlace", "#pContent", "#pDistance", "#pPace", "#pContact"].forEach((s) => { $(s).value = ""; });
      $("#postMsg").textContent = "";
      $("#postModal").classList.remove("show"); document.body.classList.remove("no-scroll");
      await loadPlaza(); go("plaza"); toast("已发布");
    } catch (e) { $("#postMsg").textContent = e.message; }
  }

  async function doJoin(id) {
    if (!logged()) { toast("登录后才能申请加入"); openAuth("login"); return; }
    if (state.myJoins[id]) { toast("已经申请过了"); return; }
    const msg = prompt("留个言（可选）：几点到、能不能跟上配速", "") || "";
    try {
      const jb = { post_id: id, user_id: state.profile.id, username: state.profile.username, message: msg };
      try {
        await api("/rest/v1/joins", { method: "POST", body: Object.assign({}, jb, { avatar_url: state.profile.avatar_url || null }) });
      } catch (e) {
        if (!missingCol(e)) throw e;
        await api("/rest/v1/joins", { method: "POST", body: jb });
      }
      state.myJoins[id] = true;
      state.joinCounts[id] = (state.joinCounts[id] || 0) + 1;
      renderPlaza(); toast("已申请");
    } catch (e) { toast("申请失败：" + e.message); }
  }

  function avatarHTML(url, name, cls, extra) {
    const initial = (name || "?").slice(0, 1).toUpperCase();
    const style = extra || "";
    if (url) return '<span class="avatar ' + (cls || "") + '" style="' + style + '"><img src="' + url + '" alt=""></span>';
    return '<span class="avatar ' + (cls || "") + '" style="' + style + '">' + esc(initial) + "</span>";
  }

  function compressSquare(file, size, quality, cb) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const side = Math.min(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(
        img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size
      );
      let out = "";
      try { out = c.toDataURL("image/jpeg", quality); } catch (e) {}
      URL.revokeObjectURL(url);
      cb(out);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(""); };
    img.src = url;
  }

  function pickAvatar() {
    if (!logged()) { toast("登录后才能设置头像"); return; }
    const i = document.createElement("input");
    i.type = "file";
    i.accept = "image/*";
    i.onchange = function () {
      const f = i.files[0];
      if (!f) return;
      compressSquare(f, 200, 0.8, async function (data) {
        if (!data) { toast("图片读取失败"); return; }
        try {
          await api("/rest/v1/profiles?id=eq." + state.profile.id, {
            method: "PATCH", body: { avatar_url: data }, headers: { Prefer: "return=minimal" }
          });
          state.profile.avatar_url = data;
          refreshAuth(); renderMe(); renderPlaza();
          toast("头像已更新");
        } catch (e) {
          toast(missingCol(e) ? "请先在 Supabase 执行 add-social-updates.sql" : "上传失败：" + e.message);
        }
      });
    };
    i.click();
  }

  function refreshAuth() {
    const name = state.profile ? state.profile.username : null;
    const initial = name ? name.slice(0, 1).toUpperCase() : "登";
    ["avatarSide", "avatarTop", "avatarBig"].forEach((id) => { const el = $("#" + id); if (el) el.textContent = initial; });
    const lbl = $("#acctLabelSide"); if (lbl) lbl.textContent = name || "登录 / 注册";
    const na = $("#navAdmin"); if (na) na.style.display = admin() ? "" : "none";
    const banner = $("#cloudBanner"); if (banner) banner.style.display = state.cloudReady ? "none" : "";
  }

  /* ================= 键盘 / 遮罩 ================= */
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === "Escape") { closeSheet(); closeSearch(); closeAuth(); closeAccount(); $("#postModal").classList.remove("show"); document.body.classList.remove("no-scroll"); }
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); openSearch(); return; }
    if (typing) return;
    if (e.key === "/") { e.preventDefault(); openSearch(); }
    const map = { "1": "today", "2": "plan", "3": "plaza", "4": "records", "5": "me" };
    if (map[e.key]) go(map[e.key]);
  });
  $("#backdrop").addEventListener("click", closeSheet);
  $$(".modal").forEach((m) => m.addEventListener("click", (e) => { if (e.target === m) { m.classList.remove("show"); document.body.classList.remove("no-scroll"); } }));
  document.addEventListener("input", (e) => { if (e.target.id === "gsearch") renderSearch(e.target.value); });

  /* ================= 启动 ================= */
  applyTheme();
  refreshAuth();
  const wm = $("#weekmeta"); if (wm) wm.textContent = S.plan + " · 第 " + (S.block + 1) + " 周";
  const h = (location.hash || "").slice(1);
  if (["today", "plan", "plaza", "records", "me", "pace", "notes", "admin"].indexOf(h) >= 0) VIEW = h;
  go(VIEW, { keep: true });

  (async function boot() {
    await checkCloud();
    refreshAuth();
    if (session) {
      try { await hydrate(); }
      catch (e) { session = null; localStorage.removeItem(LS.session); refreshAuth(); }
    }
    if (VIEW === "plaza") loadPlaza().then(renderPlaza);
    if (VIEW === "admin") loadAdmin().catch(() => {});
  })();
})();
</script>
</body>
</html>
